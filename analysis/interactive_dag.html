             #mynetwork {
                 width: 100%;

    <body>
        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#85E3D8", "id": "soil_health", "label": "soil_health", "shape": "dot", "size": 25}, {"color": "#FFB7B2", "id": "soil_organic_carbon_pct", "label": "soil_organic_carbon_pct", "shape": "dot", "size": 25}, {"color": "#FFB7B2", "id": "irrigation_water_quality", "label": "irrigation_water_quality", "shape": "dot", "size": 25}, {"color": "#FFB7B2", "id": "synthetic_fertilizer_index", "label": "synthetic_fertilizer_index", "shape": "dot", "size": 25}, {"color": "#FFB7B2", "id": "pesticide_residue_ppb", "label": "pesticide_residue_ppb", "shape": "dot", "size": 25}, {"color": "#FFB7B2", "id": "plant_quality", "label": "plant_quality", "shape": "dot", "size": 25}, {"color": "#FFB7B2", "id": "pasture_quality", "label": "pasture_quality", "shape": "dot", "size": 25}, {"color": "#FFB7B2", "id": "meat_quality", "label": "meat_quality", "shape": "dot", "size": 25}, {"color": "#FFB7B2", "id": "gut_health", "label": "gut_health", "shape": "dot", "size": 25}, {"color": "#FFB7B2", "id": "dietary_quality", "label": "dietary_quality", "shape": "dot", "size": 25}, {"color": "#85E3D8", "id": "antibiotic_use", "label": "antibiotic_use", "shape": "dot", "size": 25}, {"color": "#85E3D8", "id": "genetics_score", "label": "genetics_score", "shape": "dot", "size": 25}]);
                  edges = new vis.DataSet([{"arrows": "to", "from": "soil_health", "to": "soil_organic_carbon_pct"}, {"arrows": "to", "from": "soil_health", "to": "irrigation_water_quality"}, {"arrows": "to", "from": "soil_health", "to": "synthetic_fertilizer_index"}, {"arrows": "to", "from": "soil_health", "to": "pesticide_residue_ppb"}, {"arrows": "to", "from": "soil_organic_carbon_pct", "to": "plant_quality"}, {"arrows": "to", "from": "soil_organic_carbon_pct", "to": "pasture_quality"}, {"arrows": "to", "from": "irrigation_water_quality", "to": "plant_quality"}, {"arrows": "to", "from": "synthetic_fertilizer_index", "to": "plant_quality"}, {"arrows": "to", "from": "pesticide_residue_ppb", "to": "plant_quality"}, {"arrows": "to", "from": "pesticide_residue_ppb", "to": "meat_quality"}, {"arrows": "to", "from": "pesticide_residue_ppb", "to": "gut_health"}, {"arrows": "to", "from": "soil_health", "to": "plant_quality"}, {"arrows": "to", "from": "plant_quality", "to": "dietary_quality"}, {"arrows": "to", "from": "soil_health", "to": "pasture_quality"}, {"arrows": "to", "from": "pasture_quality", "to": "meat_quality"}, {"arrows": "to", "from": "meat_quality", "to": "gut_health"}, {"arrows": "to", "from": "dietary_quality", "to": "gut_health"}, {"arrows": "to", "from": "soil_health", "to": "gut_health"}, {"arrows": "to", "from": "antibiotic_use", "to": "gut_health"}, {"arrows": "to", "from": "genetics_score", "to": "gut_health"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "barnesHut": {
            "avoidOverlap": 0,
            "centralGravity": 0.3,
            "damping": 0.9,
            "gravitationalConstant": -3000,
            "springConstant": 0.05,
            "springLength": 150
        },
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
